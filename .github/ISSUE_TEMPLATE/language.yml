name: Language request
description: Ask for a language to run alongside SQL on a database engine
title: "<engine>: <language>"
labels: [language]
body:
  - type: markdown
    attributes:
      value: One engine and one language per issue, please.
  - type: input
    id: engine
    attributes:
      label: Engine
      placeholder: Postgres
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Python
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Context and purpose
      description: What would this be useful for?
