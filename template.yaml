AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31  
Parameters:
  Domain:
    Type: String
  Email:
    Type: String
  Schedule:
    Type: String
  Pass:
    Type: String
  Environment:
    Type: String
  DB:
    Type: String
  Certificate:
    Type: String
  Zone:
    Type: String
  Log:
    Type: String
Globals:
  HttpApi:
    AccessLogSettings:
      DestinationArn: !Sub '${Log}${Environment}'
      Format: '{ "requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod","routeKey":"$context.routeKey", "status":"$context.status","protocol":"$context.protocol", "responseLength":"$context.responseLength", "ua":"$context.identity.userAgent", "error.message":"$context.error.message", "integration.error":"$context.integration.error" }'
    Domain:
      DomainName: !Sub '${Domain}'
      CertificateArn: !Ref Certificate
      Route53:
        HostedZoneId: !Ref Zone
  Function:
    Runtime: nodejs22.x
    MemorySize: 128
    Architectures: 
      - arm64
    EventInvokeConfig:
      MaximumRetryAttempts: 0
    VpcConfig:
      SubnetIds:
        - subnet-0465e23d91c0259f3
      SecurityGroupIds:
        - sg-0035d96573bf2b200
    Environment:
      Variables:
        PGHOST: !Ref DB
        PGDATABASE: "fiddle"
        PGUSER: lambda
        PGPASSWORD: !Ref Pass
        ADMINEMAIL: !Ref Email

Resources:

  # declared explicitly so the static route lives inside the definition SAM
  # regenerates, rather than as separate resources it silently replaces
  httpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: !Ref AWS::StackName
          version: '1.0'
        paths:
          /static/{filename}:
            get:
              responses: {}
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: GET
                uri: https://mcc-fiddle-cdn.s3.eu-west-2.amazonaws.com/{filename}
                payloadFormatVersion: '1.0'
                connectionType: INTERNET
                responseParameters:
                  '200':
                    'overwrite:header.X-Content-Type-Options': 'nosniff'
                    'overwrite:header.Content-Security-Policy': "base-uri 'none'; frame-ancestors 'none'; default-src none"
                    'overwrite:header.Strict-Transport-Security': 'max-age=31536000; includeSubDomains; preload'
            head:
              responses: {}
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: HEAD
                uri: https://mcc-fiddle-cdn.s3.eu-west-2.amazonaws.com/{filename}
                payloadFormatVersion: '1.0'
                connectionType: INTERNET
                responseParameters:
                  '200':
                    'overwrite:header.X-Content-Type-Options': 'nosniff'
                    'overwrite:header.Content-Security-Policy': "base-uri 'none'; frame-ancestors 'none'; default-src none"
                    'overwrite:header.Strict-Transport-Security': 'max-age=31536000; includeSubDomains; preload'

  sharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: /workspaces/dbfiddle/layer/shared
      CompatibleRuntimes:
        - nodejs22.x

  homeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 5
      MemorySize: 512
      Policies: AWSLambdaVPCAccessExecutionRole
      CodeUri: site/home
      Handler: index.handler
      Layers:
        - !Ref sharedLayer
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /
            Method: GET
        HeadEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /
            Method: HEAD

  fiddleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 30
      MemorySize: 512
      Policies: AWSLambdaVPCAccessExecutionRole
      CodeUri: site/fiddle
      Handler: index.handler
      Layers:
        - !Ref sharedLayer
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /{code}
            Method: GET
        HeadEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /{code}
            Method: HEAD

  runFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 30
      Policies: AWSLambdaVPCAccessExecutionRole
      CodeUri: site/run/
      Handler: index.handler
      Layers:
        - !Ref sharedLayer
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /run
            Method: POST

  testFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 60
      Policies: 
        - AWSLambdaVPCAccessExecutionRole
      CodeUri: event/test
      Handler: index.handler
      Layers:
        - !Ref sharedLayer
      Events:
        CWSchedule:
          Type: Schedule
          Properties:
            Schedule: !Ref Schedule

  downFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 60
      Policies: 
        - AWSLambdaVPCAccessExecutionRole
        - AmazonSESFullAccess
      CodeUri: event/down
      Handler: index.handler
      Layers:
        - !Ref sharedLayer
      Events:
        CWSchedule:
          Type: Schedule
          Properties:
            Schedule: !Ref Schedule

  llmsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 5
      Policies: AWSLambdaVPCAccessExecutionRole
      CodeUri: site/llms
      Handler: index.handler
      Layers:
        - !Ref sharedLayer
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /llms.txt
            Method: GET
        HeadEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /llms.txt
            Method: HEAD

  robotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 5
      Policies: AWSLambdaVPCAccessExecutionRole
      CodeUri: site/robots
      Handler: index.handler
      Layers:
        - !Ref sharedLayer
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /robots.txt
            Method: GET
        HeadEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref httpApi
            Path: /robots.txt
            Method: HEAD

Outputs:
  fiddle:
    Description: "API Gateway endpoint URL for $default stage"
    Value: !Sub "https://${httpApi}.execute-api.${AWS::Region}.amazonaws.com"
